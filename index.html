<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Gallery</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Header -->
    <header class="header">

        <div class="container">

            <h1 class="logo">
                Image Gallery
            </h1>

            <p class="tagline">
                Explore beautiful moments through images
            </p>

        </div>

    </header>

    <!-- Filter Section -->

<section class="filter-section">

    <div class="container">

        <div class="filter-buttons">

            <button class="filter-btn active" data-category="all">
                All
            </button>

            <button class="filter-btn" data-category="nature">
                Nature
            </button>

            <button class="filter-btn" data-category="city">
                City
            </button>

            <button class="filter-btn" data-category="travel">
                Travel
            </button>

            <button class="filter-btn" data-category="abstract">
                Abstract
            </button>

        </div>

    </div>

</section>

    <!-- Gallery Section -->
<section class="gallery-section">

    <div class="container">

        <h2 class="section-title">
            Explore Our Collection
        </h2>

        <div class="gallery" id="gallery">

            <!-- Images will come here -->

        </div>

    </div>

</section>

<!-- ================= LIGHTBOX ================= -->

<div class="lightbox" id="lightbox">

    <button class="lightbox-close" id="lightboxClose">
        &times;
    </button>

    <img id="lightboxImage" src="" alt="">

    <button class="lightbox-prev" id="lightboxPrev">
    &#10094;
</button>

<button class="lightbox-next" id="lightboxNext">
    &#10095;
</button>

</div>

<script src="js/script.js"></script>

</body>

</html>
